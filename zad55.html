<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Zadanie 55</title>
</head>
<body>

    <script>
        let a_now = parseInt(prompt("Podaj wysokość a:", "5"));
        let b_now = parseInt(prompt("Podaj szerokość b:", "20"));

        for (let i = 1; i <= b_now; i++) {
            document.write("*");
        }
        document.write("<br>");

        for (let i = 1; i <= (a_now - 2); i++) {
            let wiersz_now = "*";
            
            for (let j = 1; j <= (b_now - 2); j++) {
                wiersz_now = wiersz_now + "&nbsp;&nbsp;";
            }
            
            wiersz_now = wiersz_now + "*";
            document.write(wiersz_now + "<br>");
        }

        for (let i = 1; i <= b_now; i++) {
            document.write("*");
        }
        document.write("<br>");
    </script>

</body>
</html>
