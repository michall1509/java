<!DOCTYPE html>  
<html lang="pl-PL">
    <head>
        <meta charset="utf=8">
    </head>
    <body> 
        <div style="color:red;font-size:50px;"> 
            <script language="JavaScript"> 
                var x = prompt("podaj rok powstania JavaScript",""); 
                var rok_now = parseFloat(x);
                document.write(`wczytany rok = ${rok_now}` + "<br>");
                if(rok_now == 1995)
                    document.write("<font color=blue size=4>Brawo znasz rok od kiedy działa JavaScript</font>"+"<br>");
                else
                    document.write("<font color=red size=7>Źle musisz jeszcze poczytać</font>"+"<br>");
            </script> 
        </div> 
    </body> 
</html>
