<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 45_michał nowak</title>
</head>
<body>

    <h1>Zadanie 45</h1>
    <script>
        // Wczytanie liczby od użytkownika za pomocą okienka prompt
        let koniec_petli_now = prompt("Podaj liczbę końcową pętli:", "20");
        koniec_petli_now = parseInt(koniec_petli_now);

        document.write("Liczby parzyste od 2 do " + koniec_petli_now + ":<br>");

        // Pętla wypisująca liczby parzyste
        for (let i_n = 2; i_n <= koniec_petli_now; i_n += 2) {
            document.write(i_n + " ");
        }
    </script>

</body>
</html>
