<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 46</title>
</head>
<body>

    <h1>Zadanie 46_michał nowak</h1>
    
    <p>ilość wykonania pętli = 11</p>
    <p>wielkość liter = 42px</p>

    <div style="font-size: 42px;">
        <script>
            
            for (let i_n = 1; i_n <= 11; i_n++) {
                if (i_n % 2 !== 0) {  
                    document.write(i_n + ". Nowak<br>");
                } else {
                    document.write(i_n + ". Michał<br>");
                }
                
            }
        </script>
    </div>

</body>
</html>
