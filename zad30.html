<html> 
     <head> 
           <script type="text/javascript"> 
                 var owoc = { 
   smak: 'słodki', 
   gatunek: 'jabłko', 
   kolor: 'czerwony', 
   pokaz: function () 
     { 
        document.write(this.smak + ' ' + this.gatunek) 
     } 
  } 
  owoc.pokaz(); 
            </script> 
     </head> 
<body> 
 <br> 
   Programowanie obiektowe. <br> 
     Obiekt  to  owoc<br> 
pola: <script>document.write(owoc.pola);</script><br>
smak: <script>document.write(owoc.smak);</script><br>
gatunek: <script>document.write(owoc.gatunek);</script><br>
kolor: <script>document.write(owoc.pokaz());</script><br
      
</body> 

</html>
