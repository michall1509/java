<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Zadanie 57</title>
</head>
<body>

    <script>
        let l1_t_now;
        do {
            l1_t_now = parseInt(prompt("Podaj pierwszą liczbę z przedziału <20,60>:", ""));
            if (l1_t_now < 20 || l1_t_now > 60) {
                alert("liczba l1 nie należy do przedziału <20,60>");
            }
        } while (l1_t_now < 20 || l1_t_now > 60);

        let l2_t_now;
        do {
            l2_t_now = parseInt(prompt("Podaj drugą liczbę z przedziału <20,60>:", ""));
            if (l2_t_now < 20 || l2_t_now > 60) {
                alert("liczba l2 nie należy do przedziału <20,60>");
            }
        } while (l2_t_now < 20 || l2_t_now > 60);

        let pocz_now = parseInt(prompt("Podaj początkową wielkość tekstu (px):", "20"));
        let tekst_now = prompt("Podaj dowolny tekst:", "");

        let i = pocz_now;

        if (l1_t_now < l2_t_now) {
            while (i <= 100) {
                document.write("<p style=\"font-size:" + i + "px; color: black;\"><br>" + tekst_now + "<br></p>");
                i += 5;
            }
        } else if (l1_t_now > l2_t_now) {
            while (i >= 0) {
                document.write("<p style=\"font-size:" + i + "px; color: black;\"><br>" + tekst_now + "<br></p>");
                i -= 5;
            }
        } else {
            document.write("<p style=\"font-size:" + i + "px; color: black;\"><br>" + tekst_now + "<br></p>");
        }
    </script>

</body>
</html>
