<!DOCTYPE html>
<html lang="pl">
<head>
    <title>Zadanie 50 Nowak</title>
    <meta charset="utf-8">
</head>
<body>
    <div style="color:black; font-size:24px; font-family:sans-serif;">
        <script>
            let suma_now = 0;

            for (let i_now = 1; i_now <= 1000000; i_now++) {
                suma_now = suma_now + 1 / i_now;
            }

            document.write("Suma szeregu harmonicznego od 1 do 1000000 wynosi:<br>");
            document.write("suma_now = " + suma_now);
        </script>
    </div>
</body>
</html>
